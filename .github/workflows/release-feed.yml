# Posts new Unbound versions from Modrinth to the Discord #changelog channel.
name: Release feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-feed

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post new versions
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          ROLE: ${{ vars.UPDATES_ROLE_ID }}
        run: python3 .github/release-feed/post.py
      - name: Remember posted versions
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Release feed: posted versions"
            git push -q
          fi
